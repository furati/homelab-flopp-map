name: Build

# Baut das Image bei jedem PR und Push, ohne es zu veröffentlichen. Der Build
# enthält Patches, Upstream-Tests und die Host-Prüfung; scheitert einer davon,
# ist der PR rot. Danach läuft ein kurzer Rauchtest gegen den Container.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Upstream-Commit aus der Pin-Datei lesen
        id: pin
        run: echo "commit=$(sed -n 's/^UPSTREAM_COMMIT=//p' upstream.pin)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Image bauen
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: homelab-flopp-map:ci
          build-args: |
            UPSTREAM_COMMIT=${{ steps.pin.outputs.commit }}
            VERSION=ci

      - name: Rauchtest
        run: |
          docker run -d --name map --read-only --tmpfs /tmp -p 8080:8080 homelab-flopp-map:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/version.json | tee version.json
          grep -q '"upstream_commit": "${{ steps.pin.outputs.commit }}"' version.json
          curl -fsI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/u.js)" = 404
          docker rm -f map
