name: Renovate

# Self-hosted Renovate: hält den Upstream-Pin (upstream.pin), die Basis-Images im
# Dockerfile und die GitHub Actions aktuell. Braucht das Repo-Secret RENOVATE_TOKEN,
# einen KLASSISCHEN PAT mit Scope "repo" (fine-grained wird NICHT unterstützt).
#
# Der Takt steht hier und nicht in renovate.json, damit der Workflow-Cron nicht am
# Renovate-Schedule vorbeiläuft: monatlich am 1. um 04:00 UTC (FAB-010, E-8).
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

concurrency:
  group: renovate
  cancel-in-progress: false

# Renovate arbeitet mit dem PAT (RENOVATE_TOKEN). Der GITHUB_TOKEN dieses Jobs darf nur
# lesen (contents: read) und verfällt mit dem Job; der Checkout legt ihn in .git/config ab,
# das ist in einem öffentlichen Repo vertretbar. Der Checkout steht hier trotzdem, ohne
# persist-credentials: false, weil er Flottenstandard ist (alle furati-Repos mit dieser
# Action) und homelab-k3s am 22.10. einen Redirect-Fehler hatte, dessen Ursache (Checkout oder
# Action statt npx) nie getrennt gemessen wurde. In Build und Publish bleibt
# persist-credentials: false.
permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Die OFFIZIELLE Action statt `npx renovate`, einheitlich in allen furati-Repos
      # (Begründung siehe homelab-zuhause, .github/workflows/renovate.yml).
      - name: Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info
          # Ohne das committet Renovate als renovate@whitesourcesoftware.com, ein
          # Mend-Konto, das niemand hier kontrolliert; GitHub markiert die Commits
          # dann als "Unverified".
          RENOVATE_GIT_AUTHOR: "Renovate <47608163+furati@users.noreply.github.com>"
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
