# Statische Auslieferung von Flopp's Map (nginx-unprivileged, Port 8080).
# Landet im Image als /etc/nginx/conf.d/default.conf.

# Cache-Control wie im Upstream-.htaccess: HTML und JSON nie aus dem Cache.
# Dateien mit webpack-Contenthash ändern bei jedem Inhalt ihren Namen.
map $uri $cache_control {
    default "";
    ~*\.(html|json)$ "no-cache, max-age=0, must-revalidate";
    "~*\.[0-9a-f]{20}\.(js|css)$" "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Kein Zugriffslog: Query-Strings (Koordinaten) und Referrer sollen nicht
    # ein zweites Mal im Log landen. Fehler gehen nach stderr.
    access_log off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Die CSP erzwingt im Browser die Hostliste aus `known-hosts`: Kacheln nur von
    # den freigegebenen Hosts, sonst nichts außer der Instanz selbst.
    # style-src 'unsafe-inline': Upstream setzt ein style-Attribut im HTML,
    # style-loader und Leaflet erzeugen style-Elemente.
    # Referrer: OSM verlangt einen Referer, daher nur die Origin (nie die Query).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://a.tile.openstreetmap.org https://b.tile.openstreetmap.org https://c.tile.openstreetmap.org https://a.tile.opentopomap.org https://b.tile.opentopomap.org https://c.tile.opentopomap.org https://geodienste.bfn.de; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $cache_control always;
    # HSTS: Traefik terminiert TLS, nginx sieht nur HTTP. Der Header wirkt trotzdem,
    # weil der Browser die Antwort über HTTPS bekommt; über HTTP liefert Traefik
    # ohnehin 404 (Ingress nur websecure). Ohne includeSubDomains und preload:
    # Unter athome laufen Dienste nur über HTTP (garten-ota, tasmota-ota).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Alle add_header stehen hier auf server-Ebene. Ein add_header in einem
    # location-Block hebt die Vererbung auf; dann fehlen dort CSP, HSTS und Co.
    # tests/static.sh prüft die Header deshalb auch auf /healthz, /version.json und Assets.

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
